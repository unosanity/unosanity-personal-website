const NOTES = [
  {
    id: 'prophet-content-strategy',
    date: '2026-04-27',
    title: 'Prophet для контент-стратегії — покроковий посібник',
    tags: ['content', 'automation', 'python', 'guide'],
    body: `# Prophet для контент-стратегії

> Як прогнозувати трафік, ловити сезонні хвилі та планувати редакційний календар на рік уперед — без ступеня зі статистики.

**Інструмент:** Prophet (Meta) · **Мова:** Python (5 рядків) · **Горизонт:** 365 днів уперед

---

## 01 — Експорт історичного трафіку

Витягніть із **GA4 або внутрішньої бази** щоденні показники переглядів. Щоб модель змогла побачити сезонність, потрібно щонайменше **1–2 роки даних** — менше дасть шум замість сигналу.

> **Ключове правило.** Не беріть увесь сайт одразу. Фільтруйте експорт за *конкретними кластерами* — освітні статті, транскрипти лекцій, окремі рубрики. Що чистіший сегмент, то корисніший прогноз. Загальна цифра по сайту змішує десятки різних динамік і приховує справжні патерни.

---

## 02 — Підготовка CSV

Prophet жорсткий до формату — він не вгадає, що ви маєте на увазі. Відкрийте експортований CSV в Excel або Google Sheets і залиште тільки **дві колонки з точно такими назвами**:

| ds         | y    |
|------------|------|
| 2024-01-01 | 1450 |
| 2024-01-02 | 1620 |
| 2024-01-03 | 1590 |

- \`ds\` — дата у форматі YYYY-MM-DD
- \`y\` — метрика (перегляди / унікальні)

---

## 03 — Налаштуйте робочий простір

Якщо ви вже працюєте з Python — запустіть **локальний Jupyter Notebook**. Якщо ні, шлях найменшого опору — відкрийте **Google Colab** просто в браузері: жодних локальних залежностей, жодного «що знову не встановилось».

У першій клітинці встановіть бібліотеки:

\`\`\`
!pip install prophet pandas matplotlib

---

## 04 — Натренуйте модель і запустіть прогноз

Завантажте \`content_traffic.csv\` у середовище і запустіть код нижче. Це бойлерплейт — модель навчиться на історичних даних, екстраполює на **365 днів уперед** і одразу побудує дві ключові візуалізації.

\`\`\`python
import pandas as pd
from prophet import Prophet
import matplotlib.pyplot as plt

# 1. Завантажуємо підготовлені дані
df = pd.read_csv('content_traffic.csv')

# 2. Ініціалізуємо й тренуємо модель
m = Prophet(yearly_seasonality=True,
            weekly_seasonality=True,
            daily_seasonality=False)
m.fit(df)

# 3. Створюємо «вікно» на 365 днів уперед
future = m.make_future_dataframe(periods=365)

# 4. Прогнозуємо
forecast = m.predict(future)

# 5. Малюємо два ключові графіки
m.plot(forecast); plt.show()
m.plot_components(forecast); plt.show()
\`\`\`

> **Що означають прапорці.** \`yearly_seasonality=True\` — шукати річні цикли (новорічні спади, осінні піки навчання). \`weekly_seasonality=True\` — шукати тижневі цикли (вихідні vs будні). \`daily_seasonality=False\` — для денних агрегатів цикл всередині доби нерелевантний.

---

## 05 — Перетворіть прогноз на редакційні дії

Скрипт згенерує **два набори візуалізацій**. Один показує майбутнє, другий — приховану структуру вашого трафіку. Ось як читати кожен і що з ним робити вже завтра вранці.

### Fig 1 — Графік прогнозу

Показує, куди рухається ваш трафік у наступному році з урахуванням усієї історії.

- **Чорні точки** — фактичні історичні дані
- **Синя лінія** — прогнозований трафік
- **Блакитна зона** — довірчий інтервал, діапазон «нормальної» поведінки

**→ Дія.** Якщо для конкретного кластера лінія починає **помітно падати в найближчі місяці** — заплануйте *редакційний рефреш* заздалегідь. Оновіть статистику, додайте свіжі тези, перепакуйте інтро. Стабілізуйте просідання, поки воно ще не настало.

### Fig 2 — Графік компонентів

Найцінніший вихід для стратега. Розкладає трафік на три прихованих шари:

**T — Тренд.** Загальна траєкторія, без сезонного шуму. Якщо денна динаміка стабільна, але тренд вниз — контент *тихо* втрачає позиції в SEO.
↳ Інвестуйте в нові кластери або глибокий рефреш.

**W — Тижнева сезонність.** Які дні тижня ваші. Освітній контент часто пікує у **вівторок–середу** й завмирає на вихідних.
↳ Не публікуйте флагман у п'ятницю.

**Y — Річна сезонність.** Природні піки інтересу впродовж року. Бачите щорічний сплеск у жовтні? Це *математичний доказ*, що ви потрібні аудиторії саме тоді.
↳ Брифуйте редакторів за 2 місяці до хвилі.

## Не забудьте — це не разова вправа

**Перенавчайте модель щокварталу.** Алгоритми пошуку змінюються, ваша аудиторія росте, нові кластери додаються. Свіжі дані → точніший прогноз. Раз на 2–3 місяці прогоняйте оновлений CSV через ту саму модель — і коригуйте редакційний план відповідно до того, як зсуваються сезонні хвилі.`

/* ─── RENDER ─── */

function estimateReadTime(body) {
  const words = body.trim().split(/\s+/).length;
  const mins = Math.max(1, Math.round(words / 200));
  return `${mins} min read`;
}

function formatDate(str) {
  const d = new Date(str + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

// Build tag set
const allTags = ['all', ...new Set(NOTES.flatMap(n => n.tags))];
const tagBar = document.getElementById('tag-bar');
let activeTag = 'all';

allTags.forEach(tag => {
  const pill = document.createElement('span');
  pill.className = 'tag-pill' + (tag === 'all' ? ' active' : '');
  pill.textContent = tag === 'all' ? 'All' : `#${tag}`;
  pill.addEventListener('click', () => {
    activeTag = tag;
    document.querySelectorAll('#tag-bar .tag-pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    filterNotes();
  });
  tagBar.appendChild(pill);
});

function filterNotes() {
  let visible = 0;
  document.querySelectorAll('.note-entry').forEach(entry => {
    const tags = entry.dataset.tags.split(',');
    const show = activeTag === 'all' || tags.includes(activeTag);
    entry.setAttribute('data-hidden', show ? 'false' : 'true');
    if (show) visible++;
  });
  document.getElementById('note-count').textContent = `${visible} entries`;
}

// Build list
const list = document.getElementById('notes-list');

if (NOTES.length === 0) {
  document.getElementById('tag-bar').style.display = 'none';
  document.getElementById('note-count').textContent = '0 entries';
  list.innerHTML = `
    <div style="padding: 80px 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center;">
      <svg width="64" height="64" viewBox="0 0 8 8" style="image-rendering:pixelated;" fill="var(--ink)">
        <rect x="2" y="1" width="1" height="2"/>
        <rect x="5" y="1" width="1" height="2"/>
        <rect x="1" y="5" width="1" height="1"/>
        <rect x="2" y="6" width="4" height="1"/>
        <rect x="6" y="5" width="1" height="1"/>
      </svg>
      <div style="font-family:var(--display);font-size:clamp(32px,5vw,56px);letter-spacing:3px;line-height:1;">NO NOTES YET</div>
      <div style="font-size:12px;color:#888;letter-spacing:1px;">come back soon-ish.</div>
    </div>
  `;
}

NOTES.forEach(note => {
  const entry = document.createElement('div');
  entry.className = 'note-entry';
  entry.dataset.tags = note.tags.join(',');
  entry.dataset.id = note.id;

  const tagsHtml = note.tags.map(t => `<span class="tag-pill">#${t}</span>`).join('');
  const readTime = estimateReadTime(note.body);
  const rendered = marked.parse(note.body.trim());

  entry.innerHTML = `
    <div class="note-entry-header">
      <span class="note-date-col">${formatDate(note.date)}</span>
      <span class="note-title-col">${note.title}</span>
      <div class="note-meta-col">
        <span class="note-read-time">${readTime}</span>
        <div class="note-tags-inline">${tagsHtml}</div>
        <span class="note-toggle">+</span>
      </div>
    </div>
    <div class="note-body">${rendered}</div>
  `;

  entry.querySelector('.note-entry-header').addEventListener('click', () => {
    const isOpen = entry.classList.contains('open');
    // close all
    document.querySelectorAll('.note-entry.open').forEach(e => e.classList.remove('open'));
    if (!isOpen) entry.classList.add('open');
  });

  list.appendChild(entry);
});

document.getElementById('note-count').textContent = `${NOTES.length} entries`;
</script>
