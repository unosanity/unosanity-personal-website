<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>notes — unosanity</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<style>
.page-header-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 30px;
  border-bottom: 1px solid var(--fg);
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--fg-mute);
  flex-wrap: wrap;
  gap: 12px;
}
.page-header-meta .lead { color: var(--fg); font-size: 14px; max-width: 60ch; }

.tag-bar {
  display: flex; flex-wrap: wrap; gap: 8px;
  padding: 14px 30px;
  border-bottom: 1px solid var(--fg);
  align-items: center;
}
.tag-bar .label {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--fg-mute); margin-right: 8px;
}

.notes-table {
  border-bottom: 1px solid var(--fg);
}
.notes-head {
  display: grid;
  grid-template-columns: 140px 1fr 220px 40px;
  gap: 16px;
  padding: 10px 30px;
  border-bottom: 1px solid var(--fg);
  background: var(--bg-frost);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--fg-mute);
}
.note-entry {
  border-bottom: 1px solid color-mix(in oklab, var(--fg) 25%, var(--bg));
  transition: background var(--t-base) var(--ease);
}
.note-entry:last-child { border-bottom: none; }
.note-entry[data-hidden="true"] { display: none; }
.note-entry:hover { background: var(--bg-frost); }
.note-entry.open { background: var(--fg); color: var(--bg); }
.note-entry.open:hover { background: var(--fg); }

.note-entry-header {
  display: grid;
  grid-template-columns: 140px 1fr 220px 40px;
  gap: 16px;
  padding: 16px 30px;
  cursor: pointer;
  align-items: baseline;
}
.note-date-col {
  font-family: var(--font-mono); font-size: 12px;
  color: var(--fg-mute);
  letter-spacing: 0.06em;
}
.note-entry.open .note-date-col { color: color-mix(in oklab, var(--bg) 70%, var(--fg)); }
.note-title-col {
  font-family: var(--font-serif);
  font-weight: 600;
  font-size: clamp(18px, 1.6vw, 22px);
  line-height: 1.25;
  color: var(--fg);
}
.note-entry.open .note-title-col { color: var(--bg); }
.note-entry:hover:not(.open) .note-title-col { color: var(--bougainvillea); }

.note-meta-col {
  display: flex; align-items: center; gap: 10px;
  justify-content: flex-end; flex-wrap: wrap;
}
.note-read-time {
  font-family: var(--font-mono); font-size: 11px;
  color: var(--fg-mute);
  white-space: nowrap;
}
.note-entry.open .note-read-time { color: color-mix(in oklab, var(--bg) 70%, var(--fg)); }

.note-tags-inline { display: flex; gap: 4px; flex-wrap: wrap; }
.note-tags-inline .tag-pill {
  font-size: 9px; padding: 2px 6px;
  border-color: color-mix(in oklab, var(--fg) 35%, var(--bg));
  color: var(--fg-mute);
}
.note-entry.open .note-tags-inline .tag-pill {
  border-color: color-mix(in oklab, var(--bg) 50%, var(--fg));
  color: color-mix(in oklab, var(--bg) 80%, var(--fg));
}

.note-toggle {
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 300;
  color: var(--fg);
  line-height: 1;
  transition: transform var(--t-base) var(--ease);
  text-align: right;
}
.note-entry.open .note-toggle {
  color: var(--bougainvillea);
  transform: rotate(45deg);
}

.note-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 600ms var(--ease), padding 400ms var(--ease);
  padding: 0 30px;
  background: var(--bg);
  color: var(--fg);
}
.note-entry.open .note-body {
  max-height: 60000px;
  padding: 30px 30px 50px;
  border-top: 1px solid var(--fg);
}

/* prose */
.note-body { font-family: var(--font-mono); font-size: 14px; line-height: 1.7; color: var(--fg); max-width: 78ch; }
.note-body h1, .note-body h2, .note-body h3, .note-body h4 {
  font-family: var(--font-serif); font-weight: 600;
  color: var(--fg); margin-top: 1.6em; margin-bottom: 0.5em;
  line-height: 1.2;
}
.note-body h1 { font-size: 28px; }
.note-body h2 { font-size: 22px; }
.note-body h2::before {
  content: "§ ";
  color: var(--bougainvillea);
  font-family: var(--font-mono);
  font-weight: 500;
}
.note-body h3 { font-size: 18px; }
.note-body h1:first-child, .note-body h2:first-child { margin-top: 0; }

.note-body p { margin: 0 0 1.2em; }
.note-body strong { color: var(--fg); font-weight: 500; }
.note-body em { font-style: italic; }
.note-body a { color: var(--fg); border-bottom: 1px solid var(--bougainvillea); transition: color var(--t-base) var(--ease); }
.note-body a:hover { color: var(--bougainvillea); }

.note-body ul, .note-body ol { margin: 0 0 1.2em 1.2em; }
.note-body li { margin-bottom: 0.4em; }
.note-body li::marker { color: var(--bougainvillea); }

.note-body blockquote {
  border-left: 2px solid var(--bougainvillea);
  padding: 8px 18px;
  margin: 1.4em 0;
  background: color-mix(in oklab, var(--bougainvillea) 6%, var(--bg));
  color: var(--fg-soft);
  font-style: italic;
}
.note-body blockquote strong { color: var(--bougainvillea); font-style: normal; }

.note-body hr {
  border: none;
  border-top: 1px dashed color-mix(in oklab, var(--fg) 40%, var(--bg));
  margin: 2em 0;
}

.note-body code {
  font-family: var(--font-mono);
  font-size: 13px;
  background: var(--bg-frost);
  border: 1px solid color-mix(in oklab, var(--fg) 25%, var(--bg));
  padding: 1px 6px;
  color: var(--bougainvillea-d);
}
.note-body pre {
  background: var(--bg-frost);
  border: 1px solid var(--fg);
  padding: 16px 18px;
  overflow-x: auto;
  margin: 1.4em 0;
  font-size: 12.5px;
  line-height: 1.55;
}
.note-body pre code { border: none; padding: 0; background: transparent; color: var(--fg); }

.note-body table {
  width: 100%;
  border-collapse: collapse;
  margin: 1.4em 0;
  font-size: 13px;
  border: 1px solid var(--fg);
}
.note-body th, .note-body td {
  padding: 8px 12px;
  border: 1px solid color-mix(in oklab, var(--fg) 30%, var(--bg));
  text-align: left;
  vertical-align: top;
}
.note-body th {
  background: var(--bg-frost);
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fg);
}

.note-body .mermaid {
  display: flex;
  justify-content: center;
  padding: 24px 16px;
  margin: 1.6em 0;
  background: var(--bg-frost);
  border: 1px solid var(--fg);
  text-align: center;
  overflow-x: auto;
}
.note-body .mermaid svg { max-width: 100%; height: auto; }

@media (max-width: 760px) {
  .notes-head, .note-entry-header {
    grid-template-columns: 100px 1fr 30px;
  }
  .note-meta-col { display: none; }
  .notes-head .meta-h, .notes-head .tags-h { display: none; }
}

.empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 18px; padding: 100px 30px;
  text-align: center;
}
.empty-state .stencil-mini {
  font-family: var(--font-mono); font-weight: 500;
  font-size: 64px; letter-spacing: 0.04em;
  -webkit-text-stroke: 1px var(--bougainvillea); color: transparent;
}
.empty-state .sub { font-family: var(--font-mono); font-size: 12px; color: var(--fg-mute); letter-spacing: 0.16em; text-transform: uppercase; }
</style>
</head>
<body>

<div class="frame">

  <nav class="site-nav">
    <a class="nav-logo" href="index.html">unosanity<em>.</em>uno</a>
    <div class="nav-links">
      <a href="index.html">index</a>
      <a href="projects.html">projects</a>
      <a href="case-studies.html">work</a>
      <a href="notes.html" class="active">notes</a>
    </div>
    <a class="nav-email" href="https://t.me/kaysane3x6">sanity@unosanity<em>.</em>uno</a>
  </nav>

  <main>

    <div class="stencil-section">
      <div class="stencil">notes</div>
    </div>

    <div class="page-header-meta">
      <span class="lead">Working notes, half-formed thoughts, transcribed voice memos. Open one at a time. Nothing here is finished — that's the point.</span>
      <span id="note-count">— entries</span>
    </div>

    <div class="tag-bar" id="tag-bar">
      <span class="label">Filter</span>
    </div>

    <div class="notes-table">
      <div class="notes-head">
        <span>date</span>
        <span>title</span>
        <span class="tags-h">read · tags</span>
        <span style="text-align:right;">+</span>
      </div>
      <div id="notes-list"></div>
    </div>

    <footer style="border-top:1px solid var(--fg);padding:16px 30px;display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:12px;color:var(--fg-mute);flex-wrap:wrap;gap:12px;">
      <span>© MMXXVI · unosanity<em style="font-style:normal;color:var(--bougainvillea)">.</em>uno</span>
      <a class="ks-link" style="font-size:12px;" href="https://t.me/kaysane3x6" target="_blank" rel="noopener">notes by appointment → telegram</a>
    </footer>
  </main>
</div>

<script src="notes-data.js"></script>
<script>
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  securityLevel: 'loose',
  fontFamily: '"DM Mono", monospace',
  themeVariables: {
    background: '#ECEFF7',
    mainBkg: '#FFFEFE',
    primaryColor: '#FFFEFE',
    primaryTextColor: '#0E1A4D',
    primaryBorderColor: '#0E1A4D',
    lineColor: '#0E1A4D',
    secondaryColor: '#ECEFF7',
    secondaryTextColor: '#0E1A4D',
    secondaryBorderColor: '#0E1A4D',
    tertiaryColor: '#A8347C',
    tertiaryTextColor: '#FFFEFE',
    tertiaryBorderColor: '#0E1A4D',
    textColor: '#0E1A4D',
    titleColor: '#0E1A4D',
    nodeBorder: '#0E1A4D',
    edgeLabelBackground: '#F4F7FB',
    clusterBkg: '#ECEFF7',
    clusterBorder: '#0E1A4D',
    quadrant1Fill: '#F1D7E6',
    quadrant2Fill: '#ECEFF7',
    quadrant3Fill: '#FFFEFE',
    quadrant4Fill: '#F4F7FB',
    quadrantTitleFill: '#0E1A4D',
    quadrantPointFill: '#A8347C',
    quadrantPointTextFill: '#0E1A4D',
    quadrantXAxisTextFill: '#6A739E',
    quadrantYAxisTextFill: '#6A739E',
    quadrantInternalBorderStrokeFill: '#0E1A4D',
    quadrantExternalBorderStrokeFill: '#0E1A4D',
    fontFamily: '"DM Mono", monospace'
  }
});

function estimateReadTime(body) {
  const words = body.trim().split(/\s+/).length;
  const mins = Math.max(1, Math.round(words / 200));
  return `${mins} min read`;
}

function formatDate(str) {
  const d = new Date(str + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }).toLowerCase();
}

const allTags = ['all', ...new Set(NOTES.flatMap(n => n.tags))];
const tagBar = document.getElementById('tag-bar');
let activeTag = 'all';

allTags.forEach(tag => {
  const pill = document.createElement('span');
  pill.className = 'tag-pill' + (tag === 'all' ? ' active' : '');
  pill.textContent = tag === 'all' ? 'all' : `#${tag}`;
  pill.addEventListener('click', () => {
    activeTag = tag;
    document.querySelectorAll('#tag-bar .tag-pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    filterNotes();
  });
  tagBar.appendChild(pill);
});

function filterNotes() {
  let visible = 0;
  document.querySelectorAll('.note-entry').forEach(entry => {
    const tags = entry.dataset.tags.split(',');
    const show = activeTag === 'all' || tags.includes(activeTag);
    entry.setAttribute('data-hidden', show ? 'false' : 'true');
    if (show) visible++;
  });
  document.getElementById('note-count').textContent = `${visible} entries`;
}

function prepareMermaidDiagrams(root) {
  root.querySelectorAll('pre > code.language-mermaid').forEach((code, index) => {
    const diagram = document.createElement('div');
    diagram.className = 'mermaid';
    diagram.dataset.diagramIndex = index;
    diagram.textContent = code.textContent;
    code.parentElement.replaceWith(diagram);
  });
}

function openNoteEntry(entry) {
  document.querySelectorAll('.note-entry.open').forEach(e => e.classList.remove('open'));
  entry.classList.add('open');
  mermaid.run({ nodes: entry.querySelectorAll('.note-body .mermaid:not([data-processed])') });
}

const list = document.getElementById('notes-list');

if (NOTES.length === 0) {
  document.getElementById('tag-bar').style.display = 'none';
  document.getElementById('note-count').textContent = '0 entries';
  list.innerHTML = `
    <div class="empty-state">
      <div class="stencil-mini">nothing here yet</div>
      <div class="sub">come back soon-ish</div>
    </div>
  `;
}

NOTES.forEach(note => {
  const entry = document.createElement('div');
  entry.className = 'note-entry';
  entry.dataset.tags = note.tags.join(',');
  entry.dataset.id = note.id;

  const tagsHtml = note.tags.map(t => `<span class="tag-pill">#${t}</span>`).join('');
  const readTime = estimateReadTime(note.body);
  const rendered = marked.parse(note.body.trim());

  entry.innerHTML = `
    <div class="note-entry-header">
      <span class="note-date-col">${formatDate(note.date)}</span>
      <span class="note-title-col">${note.title}</span>
      <div class="note-meta-col">
        <span class="note-read-time">${readTime}</span>
        <div class="note-tags-inline">${tagsHtml}</div>
      </div>
      <span class="note-toggle">+</span>
    </div>
    <div class="note-body">${rendered}</div>
  `;

  prepareMermaidDiagrams(entry);

  entry.querySelector('.note-entry-header').addEventListener('click', () => {
    const isOpen = entry.classList.contains('open');
    document.querySelectorAll('.note-entry.open').forEach(e => e.classList.remove('open'));
    if (!isOpen) openNoteEntry(entry);
  });

  list.appendChild(entry);
});

document.getElementById('note-count').textContent = `${NOTES.length} entries`;

const initialNoteId = window.location.hash.replace('#', '');
if (initialNoteId) {
  const initialEntry = document.querySelector(`.note-entry[data-id="${CSS.escape(initialNoteId)}"]`);
  if (initialEntry) openNoteEntry(initialEntry);
}
</script>
<script src="pixel-trail.js"></script>
<script>initPixelTrail({ pixelSize: 14, fadeDuration: 1200, color: '#A8347C', opacity: 0.45, gooStrength: 4 });</script>
</body>
