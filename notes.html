<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes — unosanity</title>
<link rel="stylesheet" href="style.css">
<script src="tweaks-apply.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
.page-header {
  padding: 28px 28px 0;
  border-bottom: 3px solid var(--ink);
}

.page-header h1 {
  font-family: var(--display);
  font-size: clamp(60px, 10vw, 120px);
  letter-spacing: 4px;
  line-height: 0.9;
  transform: rotate(-0.3deg);
  transform-origin: left;
}

.page-header-sub {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  border-top: 1px solid #ccc;
  margin-top: 10px;
  flex-wrap: wrap;
  gap: 10px;
}

.note-count {
  font-size: 10px;
  letter-spacing: 2px;
  color: #999;
  text-transform: uppercase;
}

/* ─── TAG FILTERS ─── */
.tag-bar {
  padding: 12px 28px;
  border-bottom: 2px solid var(--ink);
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}

.tag-bar-label {
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #999;
  margin-right: 4px;
}

/* ─── NOTE LIST ─── */
.notes-list { border-bottom: 2px solid var(--ink); }

.note-entry {
  border-bottom: 1px solid #d0ccc0;
  overflow: hidden;
}

.note-entry:last-child { border-bottom: none; }

.note-entry-header {
  display: grid;
  grid-template-columns: 100px 1fr auto;
  gap: 16px;
  align-items: center;
  padding: 14px 28px;
  cursor: pointer;
  user-select: none;
  transition: background 0.1s;
}

.note-entry-header:hover { background: rgba(0,0,0,0.03); }

.note-entry.open .note-entry-header {
  background: var(--ink);
  color: var(--bg);
  border-bottom: 1px solid #333;
}

.note-date-col {
  font-size: 10px;
  letter-spacing: 1px;
  color: #999;
  white-space: nowrap;
}

.note-entry.open .note-date-col { color: #888; }

.note-title-col {
  font-size: 14px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.note-meta-col {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.note-tags-inline { display: flex; gap: 4px; flex-wrap: wrap; }
.note-tags-inline .tag-pill { font-size: 8px; }
.note-entry.open .note-tags-inline .tag-pill { border-color: #555; color: #777; }

.note-toggle {
  font-size: 14px;
  width: 24px;
  text-align: center;
  transition: transform 0.2s;
  color: #999;
  flex-shrink: 0;
}

.note-entry.open .note-toggle {
  transform: rotate(45deg);
  color: var(--bg);
}

.note-read-time {
  font-size: 9px;
  letter-spacing: 1px;
  color: #bbb;
  white-space: nowrap;
}

/* ─── MARKDOWN BODY ─── */
.note-body {
  display: none;
  padding: 32px 28px 36px;
  border-top: 1px solid #d0ccc0;
  max-width: 720px;
}

.note-entry.open .note-body { display: block; }

/* Markdown content styles */
.note-body h1 {
  font-family: var(--display);
  font-size: 42px;
  letter-spacing: 2px;
  margin-bottom: 16px;
  line-height: 1;
  border-bottom: 3px solid var(--ink);
  padding-bottom: 10px;
}

.note-body h2 {
  font-family: var(--display);
  font-size: 28px;
  letter-spacing: 2px;
  margin: 28px 0 10px;
  line-height: 1.1;
}

.note-body h3 {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin: 22px 0 8px;
  color: #666;
}

.note-body p {
  font-size: 13px;
  line-height: 1.8;
  margin-bottom: 16px;
  max-width: 640px;
}

.note-body ul, .note-body ol {
  padding-left: 20px;
  margin-bottom: 16px;
}

.note-body li {
  font-size: 13px;
  line-height: 1.8;
  margin-bottom: 4px;
}

.note-body a { text-decoration: underline; text-underline-offset: 2px; }
.note-body a:hover { color: var(--red); }

.note-body blockquote {
  border-left: 3px solid var(--ink);
  padding: 8px 0 8px 18px;
  margin: 20px 0;
  color: #555;
  font-style: italic;
}

.note-body code {
  font-family: var(--mono);
  font-size: 11px;
  background: var(--ink);
  color: #b8f500;
  padding: 1px 5px;
}

.note-body pre {
  background: var(--ink);
  color: #d0d0d0;
  padding: 18px 20px;
  overflow-x: auto;
  margin: 16px 0;
  border: none;
}

.note-body pre code {
  background: none;
  color: inherit;
  padding: 0;
  font-size: 11px;
  line-height: 1.7;
}

.note-body hr {
  border: none;
  border-top: 2px solid var(--ink);
  margin: 28px 0;
}

.note-body strong { font-weight: 700; }
.note-body em { font-style: italic; }

/* ─── EMPTY STATE ─── */
.empty-state {
  padding: 60px 28px;
  font-size: 12px;
  color: #999;
  font-style: italic;
}

/* hidden */
.note-entry[data-hidden="true"] { display: none; }

/* ─── MOBILE ─── */
@media (max-width: 600px) {
  .page-header { padding: 22px 18px 0; }
  .page-header h1 { font-size: clamp(48px, 16vw, 96px); letter-spacing: 2.5px; }
  .page-header-sub { padding: 10px 0; gap: 6px; }
  .note-count { font-size: 9px; }

  .tag-bar {
    padding: 12px 18px;
    overflow-x: auto;
    flex-wrap: nowrap;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tag-bar::-webkit-scrollbar { display: none; }
  .tag-bar .tag-pill { white-space: nowrap; flex-shrink: 0; }

  .note-entry-header {
    grid-template-columns: 1fr auto;
    gap: 8px 12px;
    padding: 14px 18px;
  }
  .note-date-col {
    grid-column: 1 / -1;
    grid-row: 1;
    font-size: 9px;
    color: #aaa;
  }
  .note-title-col {
    grid-column: 1;
    grid-row: 2;
    font-size: 13.5px;
    line-height: 1.35;
  }
  .note-meta-col {
    grid-column: 2;
    grid-row: 2;
    align-self: start;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }
  .note-tags-inline { justify-content: flex-end; max-width: 110px; }
  .note-read-time { font-size: 8.5px; }

  .note-body {
    padding: 24px 18px 28px;
    max-width: 100%;
  }
  .note-body h1 { font-size: 32px; letter-spacing: 1.5px; }
  .note-body h2 { font-size: 22px; letter-spacing: 1.5px; margin: 22px 0 8px; }
  .note-body h3 { font-size: 12px; }
  .note-body p { font-size: 13px; line-height: 1.75; }
  .note-body li { font-size: 13px; line-height: 1.75; }
  .note-body pre { padding: 14px 14px; font-size: 10.5px; }
  .note-body pre code { font-size: 10.5px; line-height: 1.65; }
  .note-body code { font-size: 10.5px; word-break: break-word; }
  .note-body blockquote { padding-left: 14px; margin: 16px 0; }
  .note-body table { font-size: 12px; }
}

@media (max-width: 380px) {
  .note-entry-header { padding: 12px 14px; }
  .note-body { padding: 20px 14px 24px; }
  .note-body h1 { font-size: 28px; }
}

/* tables and code overflow */
.note-body table {
  width: 100%;
  border-collapse: collapse;
  margin: 16px 0;
  font-size: 12px;
}
.note-body th, .note-body td {
  padding: 8px 10px;
  border: 1px solid #c9c5b8;
  text-align: left;
}
.note-body th {
  background: var(--ink);
  color: var(--bg);
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  font-size: 10px;
}
</style>
</head>

<main>
  <div class="page-header">
    <h1>NOTES</h1>
    <div class="page-header-sub">
      <span class="note-count" id="note-count">— entries</span>
      <span style="font-size:10px;color:#999;letter-spacing:1px;">raw markdown. click to read.</span>
    </div>
  </div>

  <div class="tag-bar" id="tag-bar">
    <span class="tag-bar-label">Tags:</span>
  </div>

  <div class="notes-list" id="notes-list"></div>
</main>

<script>
/* ═══════════════════════════════════════════════════════
   NOTES DATA — ADD YOUR NOTES HERE
   Each note has:
     id       : unique slug string
     date     : 'YYYY-MM-DD'
     title    : string
     tags     : string[]
     body     : markdown string (use backtick template literal)

   To add a new note, copy one of the objects below
   and paste it at the top of the array.
═══════════════════════════════════════════════════════ */
const NOTES = [
  {
    id: 'prophet-content-strategy',
    date: '2026-04-27',
    title: 'Prophet for Content Strategy — A Step-by-Step Guide',
    tags: ['content', 'automation', 'python', 'guide'],
    body: `# Prophet for Content Strategy

> How to forecast traffic, catch seasonal waves, and plan an editorial calendar a year ahead — without a degree in statistics.

**Tool:** Prophet (Meta) · **Language:** Python (5 lines) · **Horizon:** 365 days ahead

---

## 01 — Export historical traffic

Pull daily pageview metrics from **GA4 or your internal database**. For the model to detect seasonality, you need at least **1–2 years of data** — anything less gives noise instead of signal.

> **Key rule.** Don't take the whole site at once. Filter the export by *specific clusters* — educational articles, lecture transcripts, individual sections. The cleaner the segment, the more useful the forecast. The site-wide number mixes dozens of different dynamics and hides the real patterns.

---

## 02 — Prepare the CSV

Prophet is strict about format — it won't guess what you mean. Open the exported CSV in Excel or Google Sheets and leave only **two columns with these exact names**:

| ds         | y    |
|------------|------|
| 2024-01-01 | 1450 |
| 2024-01-02 | 1620 |
| 2024-01-03 | 1590 |

- \\`ds\\` — date in YYYY-MM-DD format
- \\`y\\` — the metric (pageviews / unique visitors)

---

## 03 — Set up your workspace

If you already work with Python — fire up a **local Jupyter Notebook**. If not, the path of least resistance is **Google Colab** right in the browser: no local dependencies, no "what hasn't installed this time."

In the first cell, install the libraries:

\\`\\`\\`
!pip install prophet pandas matplotlib
\\`\\`\\`

---

## 04 — Train the model and run the forecast

Upload \\`content_traffic.csv\\` to your environment and run the code below. This is boilerplate — the model trains on historical data, extrapolates **365 days ahead**, and immediately produces two key visualizations.

\\`\\`\\`python
import pandas as pd
from prophet import Prophet
import matplotlib.pyplot as plt

# 1. Load the prepared data
df = pd.read_csv('content_traffic.csv')

# 2. Initialize and train the model
m = Prophet(yearly_seasonality=True,
            weekly_seasonality=True,
            daily_seasonality=False)
m.fit(df)

# 3. Create a 365-day "window" into the future
future = m.make_future_dataframe(periods=365)

# 4. Forecast
forecast = m.predict(future)

# 5. Plot the two key charts
m.plot(forecast); plt.show()
m.plot_components(forecast); plt.show()
\\`\\`\\`

> **What the flags mean.** \\`yearly_seasonality=True\\` — look for yearly cycles (New Year dips, autumn learning peaks). \\`weekly_seasonality=True\\` — look for weekly cycles (weekends vs weekdays). \\`daily_seasonality=False\\` — for daily aggregates, intra-day cycles are irrelevant.

---

## 05 — Turn the forecast into editorial action

The script generates **two sets of visualizations**. One shows the future, the other reveals the hidden structure of your traffic. Here's how to read each one and what to do with it tomorrow morning.

### Fig 1 — Forecast plot

Shows where your traffic is heading next year, accounting for all historical context.

- **Black dots** — actual historical data
- **Blue line** — forecasted traffic
- **Light-blue band** — confidence interval, the range of "normal" behavior

**→ Action.** If the line for a specific cluster starts to **drop noticeably in the coming months** — schedule an *editorial refresh* in advance. Update statistics, add fresh takes, repackage the intro. Stabilize the dip before it actually arrives.

### Fig 2 — Components plot

The most valuable output for a strategist. Decomposes traffic into three hidden layers:

**T — Trend.** The overall trajectory, stripped of seasonal noise. If daily dynamics are stable but the trend points down — your content is *quietly* losing SEO ground.
↳ Invest in new clusters or a deep refresh.

**W — Weekly seasonality.** Which days of the week are yours. Educational content often peaks on **Tuesday–Wednesday** and goes quiet on weekends.
↳ Don't ship your flagship on a Friday.

**Y — Yearly seasonality.** Natural peaks of interest throughout the year. See an annual spike in October? That's *mathematical proof* the audience needs you exactly then.
↳ Brief editors 2 months before the wave hits.

---

## Don't forget — this isn't a one-off exercise

**Retrain the model every quarter.** Search algorithms shift, your audience grows, new clusters appear. Fresh data → sharper forecast. Every 2–3 months, run an updated CSV through the same model — and adjust the editorial plan to match how the seasonal waves are moving.\`
  }
];

/* ─── RENDER ─── */

function estimateReadTime(body) {
  const words = body.trim().split(/\s+/).length;
  const mins = Math.max(1, Math.round(words / 200));
  return `${mins} min read`;
}

function formatDate(str) {
  const d = new Date(str + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

// Build tag set
const allTags = ['all', ...new Set(NOTES.flatMap(n => n.tags))];
const tagBar = document.getElementById('tag-bar');
let activeTag = 'all';

allTags.forEach(tag => {
  const pill = document.createElement('span');
  pill.className = 'tag-pill' + (tag === 'all' ? ' active' : '');
  pill.textContent = tag === 'all' ? 'All' : `#${tag}`;
  pill.addEventListener('click', () => {
    activeTag = tag;
    document.querySelectorAll('#tag-bar .tag-pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    filterNotes();
  });
  tagBar.appendChild(pill);
});

function filterNotes() {
  let visible = 0;
  document.querySelectorAll('.note-entry').forEach(entry => {
    const tags = entry.dataset.tags.split(',');
    const show = activeTag === 'all' || tags.includes(activeTag);
    entry.setAttribute('data-hidden', show ? 'false' : 'true');
    if (show) visible++;
  });
  document.getElementById('note-count').textContent = `${visible} entries`;
}

// Build list
const list = document.getElementById('notes-list');

if (NOTES.length === 0) {
  document.getElementById('tag-bar').style.display = 'none';
  document.getElementById('note-count').textContent = '0 entries';
  list.innerHTML = `
    <div style="padding: 80px 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center;">
      <svg width="64" height="64" viewBox="0 0 8 8" style="image-rendering:pixelated;" fill="var(--ink)">
        <rect x="2" y="1" width="1" height="2"/>
        <rect x="5" y="1" width="1" height="2"/>
        <rect x="1" y="5" width="1" height="1"/>
        <rect x="2" y="6" width="4" height="1"/>
        <rect x="6" y="5" width="1" height="1"/>
      </svg>
      <div style="font-family:var(--display);font-size:clamp(32px,5vw,56px);letter-spacing:3px;line-height:1;">NO NOTES YET</div>
      <div style="font-size:12px;color:#888;letter-spacing:1px;">come back soon-ish.</div>
    </div>
  `;
}

NOTES.forEach(note => {
  const entry = document.createElement('div');
  entry.className = 'note-entry';
  entry.dataset.tags = note.tags.join(',');
  entry.dataset.id = note.id;

  const tagsHtml = note.tags.map(t => `<span class="tag-pill">#${t}</span>`).join('');
  const readTime = estimateReadTime(note.body);
  const rendered = marked.parse(note.body.trim());

  entry.innerHTML = `
    <div class="note-entry-header">
      <span class="note-date-col">${formatDate(note.date)}</span>
      <span class="note-title-col">${note.title}</span>
      <div class="note-meta-col">
        <span class="note-read-time">${readTime}</span>
        <div class="note-tags-inline">${tagsHtml}</div>
        <span class="note-toggle">+</span>
      </div>
    </div>
    <div class="note-body">${rendered}</div>
  `;

  entry.querySelector('.note-entry-header').addEventListener('click', () => {
    const isOpen = entry.classList.contains('open');
    // close all
    document.querySelectorAll('.note-entry.open').forEach(e => e.classList.remove('open'));
    if (!isOpen) entry.classList.add('open');
  });

  list.appendChild(entry);
});

document.getElementById('note-count').textContent = `${NOTES.length} entries`;
</script>
