<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>projects — unosanity</title>
<link rel="icon" href="/assets/favicon.png">
<link rel="stylesheet" href="/style.css">
<style>
/* page header meta */
.page-header-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 30px;
  border-bottom: 1px solid var(--fg);
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--fg-mute);
  flex-wrap: wrap;
  gap: 12px;
}
.page-header-meta .lead {
  color: var(--fg);
  font-size: 14px;
  max-width: 50ch;
}

/* filters */
.filter-bar {
  padding: 14px 30px;
  border-bottom: 1px solid var(--fg);
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}
.filter-label {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--fg-mute);
  margin-right: 8px;
}

/* grid */
.projects-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
}
@media (max-width: 920px) { .projects-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) { .projects-grid { grid-template-columns: 1fr; } }

.project-card {
  position: relative;
  padding: 26px 24px 22px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  cursor: pointer;
  transition: background var(--t-base) var(--ease);
  text-decoration: none;
  color: var(--fg);
  border-right: 1px solid var(--fg);
  border-bottom: 1px solid var(--fg);
  min-height: 240px;
  background: transparent;
}
.project-card:nth-child(3n) { border-right: none; }
@media (max-width: 920px) {
  .project-card:nth-child(3n) { border-right: 1px solid var(--fg); }
  .project-card:nth-child(2n) { border-right: none; }
}
@media (max-width: 600px) {
  .project-card:nth-child(2n) { border-right: 1px solid var(--fg); }
  .project-card { border-right: none; }
}

.project-card:hover { background: var(--bg-frost); }

.project-card.featured {
  grid-column: span 2;
  background: var(--bg-pure);
}
@media (max-width: 920px) {
  .project-card.featured { grid-column: span 2; }
}
@media (max-width: 600px) {
  .project-card.featured { grid-column: span 1; }
}
.project-card.featured::before {
  content: "featured";
  position: absolute;
  top: 14px;
  right: 18px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--bougainvillea);
  background: var(--bg);
  padding: 2px 8px;
  border: 1px solid var(--bougainvillea);
  border-radius: 2px;
}

.card-num {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--fg-mute);
}

.card-title {
  font-family: var(--font-serif);
  font-weight: 600;
  font-size: clamp(24px, 2.4vw, 32px);
  line-height: 1.1;
  color: var(--fg);
  transition: color var(--t-base) var(--ease);
}
.featured .card-title {
  font-size: clamp(34px, 4vw, 52px);
}

.project-card:hover .card-title { color: var(--bougainvillea); }

.card-desc {
  font-family: var(--font-mono);
  font-size: 14px;
  line-height: 1.55;
  color: var(--fg-soft);
  flex: 1;
  max-width: 56ch;
}

.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: auto;
  padding-top: 12px;
  border-top: 1px solid color-mix(in oklab, var(--fg) 25%, var(--bg));
  flex-wrap: wrap;
}

.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.card-tags .tag-pill {
  border-color: color-mix(in oklab, var(--fg) 35%, var(--bg));
  color: var(--fg-mute);
  font-size: 10px;
}

.card-arrow {
  width: 22px;
  height: 22px;
  background: url(assets/icons/link-arrow--big.png) center/22px no-repeat;
  flex-shrink: 0;
  transition: transform var(--t-base) var(--ease);
  filter: grayscale(1) brightness(0.3);
}
.project-card:hover .card-arrow { transform: translate(6px, -6px); filter: none; }

.project-card[data-hidden="true"] { display: none; }
</style>
</head>
<body>

<div class="frame">

  <nav class="site-nav">
    <a class="nav-logo" href="/">unosanity<em>.</em>uno</a>
    <div class="nav-links">
      <a href="/">index</a>
      <a href="/projects/" class="active">projects</a>
      <a href="/case-studies/">work</a>
      <a href="/notes/">notes</a>
    </div>
    <a class="nav-email" href="https://t.me/kaysane3x6">sanity@unosanity<em>.</em>uno</a>
  </nav>

  <main>

    <div class="stencil-section">
      <div class="stencil">projects</div>
    </div>

    <div class="page-header-meta">
      <span class="lead">Things I'm building. Click anything — nothing bites.</span>
      <span id="count-label">— items</span>
    </div>

    <div class="filter-bar">
      <span class="filter-label">Filter</span>
      <span class="tag-pill active" data-filter="all">all</span>
      <span class="tag-pill" data-filter="app">app</span>
      <span class="tag-pill" data-filter="tool">tool</span>
      <span class="tag-pill" data-filter="art">art</span>
      <span class="tag-pill" data-filter="essay">essay</span>
      <span class="tag-pill" data-filter="experiment">experiment</span>
    </div>

    <div class="projects-grid" id="projects-grid"></div>

    <footer style="border-top:1px solid var(--fg);padding:16px 30px;display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:12px;color:var(--fg-mute);flex-wrap:wrap;gap:12px;">
      <span>© MMXXVI · unosanity<em style="font-style:normal;color:var(--bougainvillea)">.</em>uno</span>
      <a class="ks-link" style="font-size:12px;" href="/case-studies/">Want paid work? → work</a>
    </footer>

  </main>
</div>

<script>
const PROJECTS = [
  {
    title: "Prophetgram",
    type: "app",
    description: "A goal-driven content strategy app for Instagram creators. You upload your data and set a goal — Prophetgram builds a 12-week calendar from forecasts of your own posts, not vibes. Powered by Meta's Prophet prediction engine. Coming soon.",
    tags: ["app", "ai", "content", "prophet"],
    link: "/Prophetgram/",
    featured: true
  },
  {
    title: "Hermes Desktop Control",
    type: "tool",
    description: "A backend plugin for Hermes Agent (NousResearch) that lets an AI observe and act on your desktop — safely. Built around a human-authorization model: the agent can look freely, but anything risky needs explicit approval and frame-bound grounding before it fires. Think remote hands, not free-running agent.",
    tags: ["python", "ai", "automation", "plugin"],
    link: "https://github.com/unosanity/hermes-desktop-control"
  }
];

function buildCard(p, i) {
  const a = document.createElement('a');
  a.className = 'project-card' + (p.featured ? ' featured' : '');
  a.href = p.link || '#';
  if (p.link && p.link !== '#' && p.link.includes('://')) {
    a.target = '_blank';
    a.rel = 'noopener';
  }
  a.setAttribute('data-type', p.type);

  const tagsHtml = (p.tags || []).map(t => `<span class="tag-pill">#${t}</span>`).join('');
  const num = String(i + 1).padStart(2, '0');

  a.innerHTML = `
    <span class="card-num">№ ${num} · ${p.type}</span>
    <div class="card-title">${p.title}</div>
    <div class="card-desc">${p.description}</div>
    <div class="card-footer">
      <div class="card-tags">${tagsHtml}</div>
      <span class="card-arrow" aria-hidden="true"></span>
    </div>
  `;
  return a;
}

const grid = document.getElementById('projects-grid');
PROJECTS.forEach((p, i) => grid.appendChild(buildCard(p, i)));

const countLabel = document.getElementById('count-label');
countLabel.textContent = `${PROJECTS.length} items`;

document.querySelectorAll('[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const f = btn.dataset.filter;
    document.querySelectorAll('.project-card').forEach(card => {
      const show = f === 'all' || card.dataset.type === f;
      card.setAttribute('data-hidden', show ? 'false' : 'true');
    });
    const visible = [...document.querySelectorAll('.project-card')].filter(c => c.dataset.hidden !== 'true').length;
    countLabel.textContent = `${visible} item${visible === 1 ? '' : 's'}`;
  });
});
</script>
<script src="/pixel-trail.js"></script>
<script>initPixelTrail({ pixelSize: 14, fadeDuration: 1200, color: '#A8347C', opacity: 0.45, gooStrength: 4 });</script>
</body>
</html>
