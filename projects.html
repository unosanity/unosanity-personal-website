<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — unosanity</title>
<link rel="stylesheet" href="style.css">
<script src="tweaks-apply.js"></script>
<style>
.page-header {
  padding: 28px 28px 0;
  border-bottom: 3px solid var(--ink);
  display: flex;
  flex-direction: column;
  gap: 0;
}

.page-header h1 {
  font-family: var(--display);
  font-size: clamp(60px, 10vw, 120px);
  letter-spacing: 4px;
  line-height: 0.9;
  transform: rotate(-0.3deg);
  transform-origin: left;
}

.page-header-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  border-top: 1px solid #ccc;
  margin-top: 10px;
}

.project-count {
  font-size: 10px;
  letter-spacing: 2px;
  color: #999;
  text-transform: uppercase;
}

/* ─── FILTERS ─── */
.filter-bar {
  padding: 14px 28px;
  border-bottom: 2px solid var(--ink);
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}

.filter-label {
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #999;
  margin-right: 6px;
}

/* ─── GRID ─── */
.projects-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-left: 2px solid var(--ink);
}

@media (max-width: 900px) { .projects-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) { .projects-grid { grid-template-columns: 1fr; } }

.project-card {
  border-right: 2px solid var(--ink);
  border-bottom: 2px solid var(--ink);
  padding: 22px 20px 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  cursor: pointer;
  transition: background 0.12s;
  text-decoration: none;
  color: var(--ink);
  position: relative;
}

.project-card:hover { background: rgba(0,0,0,0.04); }

.project-card.featured {
  grid-column: span 2;
  background: var(--ink);
  color: var(--bg);
}

.project-card.featured:hover { background: #1a1a1a; }

.project-card.dark-card {
  background: #1e1e1e;
  color: var(--bg);
}

.project-card.dark-card:hover { background: #262626; }

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.card-title {
  font-family: var(--display);
  font-size: 28px;
  letter-spacing: 2px;
  line-height: 1.05;
  flex: 1;
  margin-right: 10px;
}

.featured .card-title { font-size: clamp(36px, 4vw, 52px); }

.card-desc {
  font-size: 12px;
  line-height: 1.65;
  color: #666;
  flex: 1;
}

.featured .card-desc, .dark-card .card-desc { color: #aaa; }

.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: auto;
  padding-top: 8px;
  border-top: 1px solid rgba(0,0,0,0.12);
}

.featured .card-footer, .dark-card .card-footer {
  border-color: rgba(255,255,255,0.1);
}

.card-tags { display: flex; flex-wrap: wrap; gap: 4px; }

.card-tags .tag-pill {
  border-color: #999;
  color: #888;
  font-size: 8px;
}

.featured .card-tags .tag-pill,
.dark-card .card-tags .tag-pill {
  border-color: #555;
  color: #888;
}

.card-tags .tag-pill:hover {
  background: var(--bg);
  color: var(--ink);
}

.card-arrow {
  font-size: 18px;
  opacity: 0.4;
  transition: opacity 0.1s, transform 0.1s;
}

.project-card:hover .card-arrow { opacity: 1; transform: translateX(3px); }

/* hidden filter helper */
.project-card[data-hidden="true"] { display: none; }

/* ─── MOBILE ─── */
@media (max-width: 600px) {
  .page-header { padding: 22px 18px 0; }
  .page-header h1 { font-size: clamp(48px, 14vw, 90px); letter-spacing: 2.5px; }
  .page-header-meta { flex-wrap: wrap; gap: 6px; padding: 10px 0; }
  .project-count { font-size: 9px; }

  .filter-bar {
    padding: 12px 18px;
    overflow-x: auto;
    flex-wrap: nowrap;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-bar .tag-pill { white-space: nowrap; flex-shrink: 0; }

  .projects-grid { border-left: none; }
  .project-card { padding: 18px 16px 16px; }
  .project-card.featured { grid-column: span 1; }
  .card-title { font-size: 24px; letter-spacing: 1.5px; }
  .featured .card-title { font-size: clamp(28px, 8vw, 38px); }
  .card-desc { font-size: 12px; line-height: 1.65; }
}

@media (max-width: 380px) {
  .page-header h1 { font-size: 44px; letter-spacing: 2px; }
}
</style>
</head>
<body>

<nav class="site-nav">
  <a class="nav-logo" href="index.html">UNOSANITY</a>
  <div class="nav-links">
    <a href="index.html">Index</a>
    <a href="projects.html" class="active">Projects</a>
    <a href="case-studies.html">Work</a>
    <a href="notes.html">Notes</a>
  </div>
</nav>

<main>
  <div class="page-header">
    <h1>PROJECTS</h1>
    <div class="page-header-meta">
      <span class="project-count" id="count-label">— items</span>
      <span style="font-size:10px;color:#999;letter-spacing:1px;">click anything. nothing bites.</span>
    </div>
  </div>

  <div class="filter-bar">
    <span class="filter-label">Filter:</span>
    <span class="tag-pill active" data-filter="all">All</span>
    <span class="tag-pill" data-filter="app">App</span>
    <span class="tag-pill" data-filter="tool">Tool</span>
    <span class="tag-pill" data-filter="art">Art</span>
    <span class="tag-pill" data-filter="essay">Essay</span>
    <span class="tag-pill" data-filter="experiment">Experiment</span>
  </div>

  <div class="projects-grid" id="projects-grid"></div>
</main>

<script>
/* ═══════════════════════════════════════════
   ADD YOUR PROJECTS HERE
   type: 'app' | 'tool' | 'art' | 'essay' | 'experiment'
   link: URL or '#' if not live yet
   featured: true makes the card span 2 columns
═══════════════════════════════════════════ */
const PROJECTS = [
  {
    title: "Hermes Desktop Control",
    type: "tool",
    description: "A backend plugin for Hermes Agent (NousResearch) that lets an AI observe and act on your desktop — safely. Built around a human-authorization model: the agent can look freely, but anything risky needs explicit approval and frame-bound grounding before it fires. Think remote hands, not free-running agent.",
    tags: ["python", "AI", "automation", "plugin"],
    link: "https://github.com/unosanity/hermes-desktop-control",
    featured: true,
    dark: true
  },
  {
    title: "Prophetgram",
    type: "app",
    description: "A goal-driven content strategy app for Instagram creators. You upload your data and set a goal — Prophetgram builds a 12-week calendar from forecasts of your own posts, not vibes. Powered by Meta's Prophet prediction engine. Coming soon.",
    tags: ["app", "AI", "content", "prophet"],
    link: "Prophetgram.html",
    featured: false,
    dark: true
  }
];

function buildCard(p) {
  const a = document.createElement('a');
  a.className = 'project-card' + (p.featured ? ' featured' : '') + (p.dark ? ' dark-card' : '');
  a.href = p.link || '#';
  if (p.link && p.link !== '#' && p.link.includes('://')) a.target = '_blank';
  a.setAttribute('data-type', p.type);

  const tagsHtml = (p.tags || []).map(t => `<span class="tag-pill">#${t}</span>`).join('');

  a.innerHTML = `
    <div class="card-top">
      <div class="card-title">${p.title}</div>
      <span class="type-badge type-${p.type}">${p.type}</span>
    </div>
    <div class="card-desc">${p.description}</div>
    <div class="card-footer">
      <div class="card-tags">${tagsHtml}</div>
      <span class="card-arrow">→</span>
    </div>
  `;
  return a;
}

const grid = document.getElementById('projects-grid');
PROJECTS.forEach(p => grid.appendChild(buildCard(p)));

const countLabel = document.getElementById('count-label');
countLabel.textContent = `${PROJECTS.length} items`;

// Filter logic
document.querySelectorAll('[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const f = btn.dataset.filter;
    document.querySelectorAll('.project-card').forEach(card => {
      const show = f === 'all' || card.dataset.type === f;
      card.setAttribute('data-hidden', show ? 'false' : 'true');
    });
    const visible = [...document.querySelectorAll('.project-card')].filter(c => c.dataset.hidden !== 'true').length;
    countLabel.textContent = `${visible} items`;
  });
});
</script>
<script src="pixel-trail.js"></script>
<script>initPixelTrail({ pixelSize: 16, fadeDuration: 1200, color: '#0f0f0f', opacity: 0.9, gooStrength: 4 });</script>
</body>
</html>
