const article = `# Case Study Mining From Transcripts

Every week, in every lecture, someone offhandedly mentions a real case. "We had a client who did X and Y happened." "I worked on a project where we tested Z and the result surprised everyone." Specific. Named. Concrete. Then the lecture ends, the transcript goes into the archive, and that's it. Nobody ever reads it again.

This bothered me for a long time. We were sitting on what amounted to a private library of case-study material — battle-tested, first-person, told by people who actually did the work — and using roughly zero percent of it.

So I built a system. Three skills, one pipeline. Here's how it works.

## Why one prompt won't work

The naive version of this is: "Hey Claude, read all these transcripts and write me case-study articles." That fails three ways at once.

First, you don't actually know what's worth pulling. A lecture is mostly definitions, frameworks, and Q&A. The case material — the part where someone says "we tried X and got Y" — is maybe 5% of the runtime, scattered across dozens of transcripts, unmarked, often unnamed.

Second, you don't know what you already have. If half the cases worth writing are already covered in your published library, mining them again wastes everyone's time. You need to know your own corpus before you go quarrying.

Third, even if you had a perfectly curated list of fragments, going from "thirty seconds of speech where someone mentions a project" to "1,500-word article that reads like it was reported, not hallucinated" is its own job. Try to do it in the same pass as extraction and the model will helpfully invent the parts you don't have.

The fix is to split the work into three.

%%PIPELINE_DIAGRAM%%

Two raw inputs feed two extraction skills. Their outputs get fused, by hand, into the article mapping that drives the drafting skill. The human judgment in the middle isn't a bottleneck — it's the whole point of why the pipeline works.

## Stage 1 — Map what you have

The first skill, \`corpus-audit\`, reads the existing published library. Not transcripts. Articles. The stuff that's already out there, public, indexed.

It fans out subagents — one per article — that fingerprint each piece into a structured card: archetype, audience, topic, tone, what it does well, what it leaves on the table. Then a second phase does the corpus-level work: where are the archetype gaps, which audiences are over- or under-served, what derivative formats are sitting there waiting to be made.

The output isn't articles. It's a strategic map. Before I touch a transcript, I know exactly which case-study slots in the library are empty.

## Stage 2 — Mine the raw material

The second skill, \`case-study-miner\`, points at a folder of transcripts. Subagent per transcript again, but the job is different: scan for any moment where a real case is mentioned — named company, specific outcome, documented process, before/after numbers, anything concrete.

Each fragment goes into a tiered registry, ranked by how usable it is:

| Tier | What qualifies |
|------|----------------|
| **Named, with details** | Specific company, specific outcome, numbers attached |
| **Named, vague** | Company mentioned, outcome implied but unquantified |
| **Generic anecdote** | No name, just the shape of a story |

Then a synthesis pass looks across transcripts: did three different lecturers all touch the same company from different angles? That combination is worth more than any single fragment alone.

What comes out is a structured registry of every case-study gem buried in the archive, sorted by how usable it is, with cross-references for the combinable ones. In the first pass, case-study fragments turned out to be present in around 10% of the corpus — more than expected, but most of it tier-three material that needed pairing or external verification to become usable. Uncut gems, in a tray, labelled.

## Stage 3 — Turn fragments into an article

This is where most pipelines I've seen fall over. You have the gem. Now write 1,500 words about it without making anything up.

\`case-create-fragments\` doesn't accept a vague brief. It requires a pre-built article mapping: which fragments go where, what the skeleton looks like, what's been verified externally, what gaps remain. The work of judgment — what's the story, what's the angle, what's missing — happens before the skill runs. The skill is the cutter, not the appraiser.

Given that mapping, it produces a publication-ready draft: correct length, correct register, the speaker's voice preserved where they're being quoted, connective tissue written in the publication's voice. A humanizer pass runs at the end so the prose doesn't read like a model wrote it.

## What I learned

The thing that surprised me is how much each stage hates being merged with the others. Mining and writing are different brain modes. Auditing and mining are different brain modes. Whenever I tried to compress two stages into one, the model started cutting corners on whichever job was further from the prompt's center of gravity.

Splitting the pipeline didn't just make the output better. It made the failure modes legible. When something goes wrong now, I know whether it failed at "what do we have," "what's worth mining," or "how do we draft." Three small problems are tractable. One big problem is just a vibe.

First run: 4 case-study articles created, each from fragments that would have stayed buried in the archive. Not a revolution — just a pipeline that works, one cut at a time.

The transcripts are no longer a graveyard. They're a quarry, and the quarry has a map.`;
